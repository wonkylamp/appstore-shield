name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.os }} / Node ${{ matrix.node }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        node: [20, 22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      # The plugin runs the committed dist/cli.js (plugins installed from git are not built), so a
      # source change that was not rebuilt and committed must fail here.
      - name: Committed dist/ matches a fresh build
        run: npm run check:dist
      - run: npm run build
      - name: Build leaves the working tree clean
        run: git status --porcelain -- dist && test -z "$(git status --porcelain -- dist)"
